  { key = "p", label = "退出重进" },
  { key = "h", label = "读取位置" },
  { key = "ctrl+o", label = "读取存档" },
  { key = "f1", label = "AI 静止" },
  { key = "1", label = "无敌" },
  { key = "ctrl+n", label = "目标信息" },
  { key = "rshift+h", label = "保存位置" },
