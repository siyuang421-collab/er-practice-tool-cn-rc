[settings]
log_level = "INFO"
display = "0"
hide = "rshift+0"
dxgi_debug = false
show_console = false
disable_update_prompt = false
radial_menu_open = "l3+r3"
indicators = [
  { indicator = "game_version", enabled = true },
  { indicator = "igt", enabled = true },
  { indicator = "position", enabled = false },
  { indicator = "position_change", enabled = false },
  { indicator = "position_distance", enabled = false },
  { indicator = "animation", enabled = false },
  { indicator = "fps", enabled = false },
  { indicator = "framecount", enabled = false },
  { indicator = "imgui_debug", enabled = false }
]
theme = "蓝色"
ui_scale = "标准"

# 输入框反向映射表：仅在使用键盘映射工具（如 QKeyMapper）时为工具界面
# 还原被改写的按键，不影响游戏内的映射。方向与映射工具一致：左边写
# 你按下的原始键，右边写映射工具发给游戏的键。例：QKeyMapper 里 B→T，
# 写 `"B" = "T"`，工具输入框里按 B 会直接输入 b（游戏中仍映射为 T）。
# 一般无需手改此处，主界面「键盘映射」按钮会读写 DLL 旁的
# kb-reverse-map.toml（覆盖此处的同名键）。支持字母、数字及 Esc 等功能键：
# [keyboard-reverse-map]
# "B" = "T"
# "T" = "Esc"
